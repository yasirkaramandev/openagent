# Live provider smoke (spec §28).
#
# Deliberately NOT part of the PR gate. Two reasons, and both are load-bearing:
#
#   1. It spends money and provider quota on every run, so it is triggered on purpose or on a slow
#      schedule — never on every push.
#   2. It needs API keys. A workflow that exposes secrets to `pull_request` runs hands them to any
#      fork that opens a PR, so this file has no `pull_request` trigger at all. That is the fix;
#      `if: github.event.pull_request.head.repo.full_name == github.repository` guards are a
#      weaker version of the same idea and are easy to weaken further by accident.
#
# A provider whose key is absent SKIPS. A skip is BLOCKED_BY_CREDENTIAL, which is not a pass — the
# summary step below says so in as many words, because a green check mark on a job that tested
# nothing is exactly the outcome spec §28.4 forbids.

name: Provider live smoke

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated provider ids to smoke, or 'all'"
        required: false
        default: "all"
  schedule:
    # Weekly, Mondays 04:00 UTC. Often enough to notice a provider changing its wire format,
    # rarely enough that the bill stays negligible.
    - cron: "0 4 * * 1"

concurrency:
  # Never two live runs at once: concurrent runs multiply spend and can trip provider rate limits,
  # which then look like adapter failures.
  group: provider-live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: live smoke (${{ matrix.provider }})
    runs-on: ubuntu-latest
    # Only ever runs against this repository's own keys.
    if: github.repository == 'yasirkaramandev/openagent'
    timeout-minutes: 15
    strategy:
      # One provider's outage must not hide another's regression.
      fail-fast: false
      matrix:
        include:
          # Gemini keeps its own file: the Interactions API's step/SSE framing is the one thing the
          # shared smoke cannot assert generically (spec §10.4).
          - provider: gemini-api
            path: tests/live/test_gemini_live_smoke.py
            key_env: OPENAGENT_LIVE_GEMINI_API_KEY
            secret_name: OPENAGENT_LIVE_GEMINI_API_KEY
            select: ""
          # The remaining eight run the shared, parameterized smoke. One file rather than eight,
          # because eight hand-written live tests drift and the drift shows up as one provider
          # quietly testing less than the others.
          - provider: deepseek
            path: tests/live/test_provider_live_smoke.py
            key_env: OPENAGENT_LIVE_DEEPSEEK_API_KEY
            secret_name: OPENAGENT_LIVE_DEEPSEEK_API_KEY
            select: "deepseek"
          - provider: qwen
            path: tests/live/test_provider_live_smoke.py
            key_env: OPENAGENT_LIVE_QWEN_API_KEY
            secret_name: OPENAGENT_LIVE_QWEN_API_KEY
            select: "qwen"
          - provider: kimi
            path: tests/live/test_provider_live_smoke.py
            key_env: OPENAGENT_LIVE_KIMI_API_KEY
            secret_name: OPENAGENT_LIVE_KIMI_API_KEY
            select: "kimi"
          - provider: glm
            path: tests/live/test_provider_live_smoke.py
            key_env: OPENAGENT_LIVE_GLM_API_KEY
            secret_name: OPENAGENT_LIVE_GLM_API_KEY
            select: "glm"
          - provider: minimax
            path: tests/live/test_provider_live_smoke.py
            key_env: OPENAGENT_LIVE_MINIMAX_API_KEY
            secret_name: OPENAGENT_LIVE_MINIMAX_API_KEY
            select: "minimax"
          - provider: openrouter
            path: tests/live/test_provider_live_smoke.py
            key_env: OPENAGENT_LIVE_OPENROUTER_API_KEY
            secret_name: OPENAGENT_LIVE_OPENROUTER_API_KEY
            select: "openrouter"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check for a credential
        id: credential
        env:
          KEY: ${{ secrets[matrix.secret_name] }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.provider }}::BLOCKED_BY_CREDENTIAL — no ${{ matrix.secret_name }} configured; this is NOT a pass"
          fi

      - name: Run live smoke
        if: steps.credential.outputs.present == 'true'
        env:
          ${{ matrix.key_env }}: ${{ secrets[matrix.secret_name] }}
        # Bounded in three independent places rather than by a pytest plugin the dev extras do not
        # carry: every request is wrapped in asyncio.wait_for, the transport enforces its own
        # wall-clock budget per call, and the job has timeout-minutes above.
        #
        # `-k` narrows the shared file to one provider so a matrix entry only spends that
        # provider's quota. Without it, every entry would smoke all eight.
        run: |
          if [ -n "${{ matrix.select }}" ]; then
            python -m pytest "${{ matrix.path }}" -m integration -k "${{ matrix.select }}" --maxfail=3 -q
          else
            python -m pytest "${{ matrix.path }}" -m integration --maxfail=3 -q
          fi

      - name: Record verification status
        if: always()
        run: |
          if [ "${{ steps.credential.outputs.present }}" != "true" ]; then
            status="BLOCKED_BY_CREDENTIAL (not a pass — nothing ran)"
          elif [ "${{ job.status }}" = "success" ]; then
            status="LIVE_VERIFIED"
          else
            status="FAILED — see the step log"
          fi
          {
            echo "### ${{ matrix.provider }}"
            echo ""
            echo "**Status:** $status"
          } >> "$GITHUB_STEP_SUMMARY"

  # Local providers need a *server*, not a key, so a credential gate would skip them for the wrong
  # reason. They run against services started in the job, which also means this half of the workflow
  # costs nothing and can run on every dispatch.
  local:
    name: live smoke (ollama)
    runs-on: ubuntu-latest
    if: github.repository == 'yasirkaramandev/openagent'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          # Wait for the daemon rather than sleeping a fixed amount: a fixed sleep is either flaky
          # or slow, and on a cold runner it is both.
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/version >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:11434/api/version || { cat /tmp/ollama.log; exit 1; }

      - name: Pull the smallest useful model
        env:
          # Small on purpose: this smoke proves the wire format, not the model.
          OPENAGENT_LIVE_OLLAMA_MODEL: qwen3:0.6b
        run: ollama pull qwen3:0.6b

      - name: Run the local live smoke
        env:
          OPENAGENT_LIVE_OLLAMA_MODEL: qwen3:0.6b
        run: |
          python -m pytest tests/live/test_provider_live_smoke.py \
            -m integration -k "ollama" --maxfail=3 -q

      - name: Record verification status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            status="LIVE_VERIFIED (ollama native chat, against a real daemon)"
          else
            status="FAILED — see the step log"
          fi
          {
            echo "### ollama"
            echo ""
            echo "**Status:** $status"
          } >> "$GITHUB_STEP_SUMMARY"

  # Nothing is uploaded as an artifact on purpose. Provider request/response bodies can carry the
  # prompt, the reply and occasionally an echoed credential; the assertions in the test file are
  # the record, and the step log is redacted by TransportError before anything is printed.
  summary:
    name: summary
    needs: [smoke, local]
    if: always() && github.repository == 'yasirkaramandev/openagent'
    runs-on: ubuntu-latest
    steps:
      - name: Restate what a skip means
        run: |
          {
            echo "### How to read this run"
            echo ""
            echo "- **LIVE_VERIFIED** — a real request reached the provider and behaved as expected."
            echo "- **BLOCKED_BY_CREDENTIAL** — no key was configured, so nothing ran. This is *not* a pass."
            echo "- **FAILED** — the provider was reached and the adapter's expectations did not hold."
          } >> "$GITHUB_STEP_SUMMARY"
