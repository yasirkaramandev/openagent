# CodeQL static analysis.
#
# Two languages are scanned. `python` is the obvious one; `actions` is scanned because the
# workflows in this repository run with a token and consume untrusted PR input, and a workflow
# injection is as real a vulnerability as one in the package.
#
# The `security-extended` suite is used rather than the default: the default suite optimises for a
# low false-positive rate on large codebases, and this repository is small enough to triage the
# extra queries. Findings surface as GitHub code-scanning alerts, not as CI log noise.
name: CodeQL

on:
  push:
    branches: [main, release-candidate, "release/**", "feat/**"]
  # Two separate lessons, both kept.
  #
  # Releases are prepared as a stack: a fix branch based on a release branch, merged down. Scanning
  # only PRs that target `main` meant an entire release candidate could be built, promoted, and
  # soaked without CodeQL ever seeing it — the scan arrived after the decisions it was meant to
  # inform.
  #
  # The same hole existed one level over, for integration branches. `pull_request.branches` filters
  # on the PR's *base*, so PR #11 (base `feat/v0.2-integration`) was never scanned even though
  # `fix/**` was already listed — that pattern matched its head, which this filter never looks at.
  # A high-severity finding in that PR's own code surfaced the moment `feat/**` was added.
  pull_request:
    branches: [main, release-candidate, "release/**", "fix/**", "feat/**"]
  schedule:
    # Weekly, so a newly published query finds an existing vulnerability without waiting for the
    # next commit to this repository.
    - cron: "27 4 * * 1"
  # So a scan can be demanded on any ref at release time rather than waiting for a qualifying push.
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload the SARIF results as code-scanning alerts.
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "actions"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
