# CodeQL static analysis.
#
# Two languages are scanned. `python` is the obvious one; `actions` is scanned because the
# workflows in this repository run with a token and consume untrusted PR input, and a workflow
# injection is as real a vulnerability as one in the package.
#
# The `security-extended` suite is used rather than the default: the default suite optimises for a
# low false-positive rate on large codebases, and this repository is small enough to triage the
# extra queries. Findings surface as GitHub code-scanning alerts, not as CI log noise.
name: CodeQL

on:
  push:
    branches: [main, "release/**", "feat/v0.2-integration"]
  # Integration branches are targets too, not just main. A stacked PR that lands security-relevant
  # code on an integration branch and is only scanned once that branch opens its own PR to main
  # gets its findings at the point where reverting is most expensive — and "CodeQL is green" was
  # being read as a gate on the stacked PR, where it had in fact never run.
  pull_request:
    branches: [main, "release/**", "feat/v0.2-integration"]
  schedule:
    # Weekly, so a newly published query finds an existing vulnerability without waiting for the
    # next commit to this repository.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload the SARIF results as code-scanning alerts.
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "actions"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
