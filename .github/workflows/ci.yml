name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full lint + type-check + offline test suite + package build on Linux.
  test:
    name: test (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      # A required gate (spec §8): the formatter baseline is enforced, not aspirational. ruff is
      # pinned exactly in [dev] so this can never fail merely because a new ruff shipped.
      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      # Branch coverage, not line coverage. A line-covered `except` arm whose branch is never
      # taken reports as covered while the unhappy path stays untested — and the unhappy paths
      # (credential resolution failure, migration conflict, lock timeout) are where this project's
      # bugs live.
      - name: Pytest (offline suite — no API keys, no live CLIs)
        run: coverage run -m pytest -q

      - name: Coverage report
        run: |
          coverage combine || true
          coverage report
          coverage xml

      # Global thresholds are a floor, not a target. The modules that can lose a secret or corrupt
      # the database are held to a much higher bar; see the script for the per-module table.
      - name: Critical-module branch coverage
        run: python scripts/check_critical_coverage.py

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Build sdist + wheel
        run: python -m build

      - name: Install the built wheel in a clean venv and smoke the entrypoint
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/python -m pip install --upgrade pip
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/openagent --help
          /tmp/wheeltest/bin/openagent version

      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # Textual Select-sentinel compatibility (spec: no Textual "no selection" sentinel may cross the
  # screen/service boundary). The empty-value normalisation is version-independent by design — it
  # keys off "is the value a str?", not a sentinel name — so it survives the Select.BLANK→Select.NULL
  # rename. This job pins the exact Textual versions we have exercised end-to-end and runs the
  # sentinel + Add-Agent interaction tests against each.
  textual-compat:
    name: textual-compat (${{ matrix.textual }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        textual: ["8.2.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with pinned Textual ${{ matrix.textual }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "textual==${{ matrix.textual }}"
          python -c "import textual; print('textual', textual.__version__)"

      - name: TUI interaction tests (Run Console, wizard, modals, Select sentinel)
        run: >
          pytest -q
          tests/unit/test_select_utils.py
          tests/unit/test_agent_service_validation.py
          tests/unit/test_wizard_state.py
          tests/unit/test_tui_add_agent.py
          tests/unit/test_tui_provider.py
          tests/unit/test_tui_modals.py
          tests/unit/test_tui_live_retention.py
          tests/unit/test_tui_responsive.py
          tests/unit/test_markup_safety.py
          tests/unit/test_projection.py
          tests/integration/test_tui_run.py
          tests/integration/test_tui_ask_user.py

  container-sandbox:
    name: container-sandbox (real Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      # CI explicitly provisions the local image. The OpenAgent backend itself is then tested with
      # pulls/builds disabled and receives only this already-present image name.
      - name: Provision local Linux sandbox image
        run: docker build -t openagent-sandbox-ci tests/fixtures/container

      - name: Exercise no-network tmpfs sandbox through the real service backend
        env:
          OPENAGENT_REAL_CONTAINER: "1"
          OPENAGENT_CONTAINER_RUNTIME: docker
          OPENAGENT_CONTAINER_IMAGE: openagent-sandbox-ci
        run: pytest -q -m container tests/integration/test_container_sandbox_real.py

  wheel-lifecycle:
    name: wheel fresh + ${{ matrix.legacy-name }} upgrade/backup restore
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - legacy-name: v0.1.2
            legacy-ref: v0.1.2
          # v0.1.3 was released from this immutable commit without a repository tag.
          - legacy-name: v0.1.3
            legacy-ref: bb5a67a31d707fa947adbb5d6b192ed1138980cc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current and legacy wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir "$RUNNER_TEMP/current-dist"
          mkdir -p "$RUNNER_TEMP/legacy-src" "$RUNNER_TEMP/legacy-dist"
          git archive "${{ matrix.legacy-ref }}" | tar -x -C "$RUNNER_TEMP/legacy-src"
          python -m build "$RUNNER_TEMP/legacy-src" --outdir "$RUNNER_TEMP/legacy-dist"

      - name: Fresh current-wheel install in a sandbox HOME
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/pip" install "$RUNNER_TEMP"/current-dist/*.whl
          mkdir -p "$RUNNER_TEMP/fresh-home" "$RUNNER_TEMP/fresh-data" "$RUNNER_TEMP/fresh-config"
          HOME="$RUNNER_TEMP/fresh-home" OPENAGENT_DATA_DIR="$RUNNER_TEMP/fresh-data" \
            OPENAGENT_CONFIG_DIR="$RUNNER_TEMP/fresh-config" \
            "$RUNNER_TEMP/fresh/bin/openagent" version

      - name: Create a real legacy DB, upgrade it, and reopen its online backup copy
        run: |
          python -m venv "$RUNNER_TEMP/upgrade"
          "$RUNNER_TEMP/upgrade/bin/pip" install "$RUNNER_TEMP"/legacy-dist/*.whl
          mkdir -p "$RUNNER_TEMP/upgrade-home" "$RUNNER_TEMP/upgrade-data" \
            "$RUNNER_TEMP/upgrade-config" "$RUNNER_TEMP/legacy-project"
          export HOME="$RUNNER_TEMP/upgrade-home"
          export OPENAGENT_DATA_DIR="$RUNNER_TEMP/upgrade-data"
          export OPENAGENT_CONFIG_DIR="$RUNNER_TEMP/upgrade-config"
          export LEGACY_PROJECT="$RUNNER_TEMP/legacy-project"
          "$RUNNER_TEMP/upgrade/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from openagent.app import OpenAgentApp
          from openagent.core.models import RuntimeType
          app = OpenAgentApp.create(Path(os.environ["LEGACY_PROJECT"]))
          app.agents.create(name="legacy-agent", runtime_type=RuntimeType.CLI, cli="codex")
          PY
          "$RUNNER_TEMP/upgrade/bin/pip" install --upgrade --force-reinstall \
            "$RUNNER_TEMP"/current-dist/*.whl
          "$RUNNER_TEMP/upgrade/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from openagent.app import OpenAgentApp
          app = OpenAgentApp.create(Path(os.environ["LEGACY_PROJECT"]))
          assert app.agents.get("legacy-agent") is not None
          PY
          backup=$(find "$RUNNER_TEMP/upgrade-data" -name '*.bak' -print -quit)
          test -n "$backup"
          cp "$backup" "$RUNNER_TEMP/restored.db"
          RESTORED_DB="$RUNNER_TEMP/restored.db" "$RUNNER_TEMP/upgrade/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from openagent.storage.db import Database
          from openagent.storage.migrations import LATEST_VERSION, current_version
          db = Database.open(Path(os.environ["RESTORED_DB"]))
          with db.engine.begin() as conn:
              assert current_version(conn) == LATEST_VERSION
              assert conn.exec_driver_sql("SELECT COUNT(*) FROM agents").scalar() == 1
          PY

  # Cross-platform smoke: install, build, entrypoint, and the platform-sensitive smoke tests
  # (path handling, process management, keyring fallback, TUI import/startup).
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Cross-platform smoke tests
        run: pytest -q tests/smoke

      - name: CLI entrypoint
        run: |
          openagent --help
          openagent version

      - name: Build package
        run: python -m build

  # Production install (§3.4). The installer-unix / installer-windows jobs below all set
  # OPENAGENT_SETUP_LOCAL=1, which means every installer job we had was testing the *developer*
  # path — installing a working tree. The thing users actually run was never exercised: install
  # from the official VCS URL at an exact commit, with PEP 610 provenance and channel metadata to
  # prove it. That is what this job does, and it asserts the provenance rather than assuming it.
  #
  # It installs the current release-candidate tip, not this PR's commit, because a PR commit is not
  # on a channel — and refusing it is the point of §3.5, asserted directly in the last step.
  installer-production:
    name: production install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      OPENAGENT_SETUP_NO_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately awkward paths: a space and a non-ASCII segment, plus custom UV_TOOL_DIR and
      # OPENAGENT_HOME. Installers break on exactly these and nowhere else.
      - name: Isolate uv and OpenAgent directories (spaces + non-ASCII)
        run: |
          base="$RUNNER_TEMP/oa production/kurulum-öçşğü"
          mkdir -p "$base"
          {
            echo "UV_TOOL_DIR=$base/uv/tools"
            echo "UV_TOOL_BIN_DIR=$base/uv/bin"
            echo "UV_PYTHON_INSTALL_DIR=$base/uv/py"
            echo "OPENAGENT_HOME=$base/home"
            echo "OPENAGENT_DATA_DIR=$base/data"
            echo "OPENAGENT_CONFIG_DIR=$base/config"
            echo "OA_BASE=$base"
          } >> "$GITHUB_ENV"

      - name: Resolve the exact release-candidate commit
        run: |
          sha="$(git ls-remote https://github.com/yasirkaramandev/openagent.git \
                 refs/heads/release-candidate | cut -f1)"
          test -n "$sha" || { echo "could not resolve release-candidate"; exit 1; }
          echo "CANDIDATE_SHA=$sha" >> "$GITHUB_ENV"
          echo "installing exact commit $sha"

      - name: Production install from the official repository at that exact commit
        run: |
          checkout="$OA_BASE/checkout"
          git clone --quiet https://github.com/yasirkaramandev/openagent.git "$checkout"
          git -C "$checkout" checkout --quiet "$CANDIDATE_SHA"
          git -C "$checkout" rev-parse HEAD > "$OA_BASE/checkout-head-before"
          # Test *this PR's* installers against a real channel commit. Without the copy the job
          # would run the installer as it exists at the channel tip, which predates the change under
          # review — it would be asserting new behaviour against the old script. HEAD is untouched,
          # so the installer still resolves and installs the channel commit. Once this lands and is
          # promoted, the copy is a no-op.
          cp setup.sh setup.ps1 setup.bat "$checkout/"
          # No OPENAGENT_SETUP_LOCAL: this is the real production path.
          bash "$checkout/setup.sh"

      - name: Provenance is an official exact-commit VCS install
        run: |
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          direct_url="$(find "$UV_TOOL_DIR" -name direct_url.json | head -1)"
          test -n "$direct_url" || { echo "no direct_url.json: not a VCS install"; exit 1; }
          cat "$direct_url"
          python3 - "$direct_url" "$CANDIDATE_SHA" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          assert payload["url"].endswith("yasirkaramandev/openagent.git"), payload["url"]
          info = payload["vcs_info"]
          assert info["vcs"] == "git", info
          assert info["commit_id"] == sys.argv[2], (info["commit_id"], sys.argv[2])
          print("direct_url.json: official repository at the exact target commit")
          PY

      - name: install.json records the channel and the accepted commit
        run: |
          cat "$OPENAGENT_HOME/install.json"
          python3 - "$OPENAGENT_HOME/install.json" "$CANDIDATE_SHA" <<'PY'
          import json, sys
          meta = json.load(open(sys.argv[1]))
          assert meta["source"] == "official-github-vcs", meta["source"]
          assert meta["repository"] == "yasirkaramandev/openagent", meta["repository"]
          assert meta["channel"] in {"candidate", "stable"}, meta["channel"]
          assert meta["installed_commit"] == sys.argv[2], meta["installed_commit"]
          assert meta["last_accepted_commit"] == sys.argv[2], meta["last_accepted_commit"]
          print("install.json: channel + exact accepted commit recorded")
          PY

      - name: PATH resolves the installed executable, version and doctor are sane
        run: |
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          resolved="$(command -v openagent)"
          test "$resolved" = "$UV_TOOL_BIN_DIR/openagent" || { echo "PATH resolves $resolved"; exit 1; }
          openagent version
          openagent doctor --json > "$OA_BASE/doctor.json" || true
          python3 -c "import json,sys; json.load(open(sys.argv[1])); print('doctor json ok')" "$OA_BASE/doctor.json"

      - name: "update --check is a clean no-op on the freshly installed commit"
        run: |
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          openagent update --check --json > "$OA_BASE/update.json" || true
          python3 - "$OA_BASE/update.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          print(json.dumps(payload)[:400])
          PY

      - name: Second production install is idempotent and leaves the checkout untouched
        run: |
          checkout="$OA_BASE/checkout"
          bash "$checkout/setup.sh"
          git -C "$checkout" rev-parse HEAD > "$OA_BASE/checkout-head-after"
          diff "$OA_BASE/checkout-head-before" "$OA_BASE/checkout-head-after"
          # The installer scripts were copied in by the install step above; nothing *else* may have
          # changed. An installer that writes into the user's checkout is the bug being excluded.
          dirty="$(git -C "$checkout" status --porcelain | grep -vE ' (setup\.sh|setup\.ps1|setup\.bat)$' || true)"
          test -z "$dirty" || { echo "installer dirtied the checkout:"; echo "$dirty"; exit 1; }

      # §3.5: this PR's own commit is reachable from an official ref (refs/pull/N/head), which is
      # exactly what the old membership test accepted. It is not on a channel, so it must be
      # refused as a production install source — and the refusal must name the supported way in.
      - name: A feature-branch commit is refused as a production install source
        run: |
          if bash setup.sh > "$RUNNER_TEMP/feature.log" 2>&1; then
            echo "FAIL: a non-channel commit was accepted as a production install"
            exit 1
          fi
          cat "$RUNNER_TEMP/feature.log"
          grep -qi "is not on the\|not a published stable release" "$RUNNER_TEMP/feature.log"
          grep -q "OPENAGENT_SETUP_LOCAL=1" "$RUNNER_TEMP/feature.log"

  # Real installer jobs (§5). These deliberately do NOT use actions/setup-python — the point is to
  # simulate a machine where the user has not installed Python, and prove setup.sh / setup.bat bring
  # their own managed Python via uv. They need network access (uv + managed Python + PyPI), so they
  # are a separate, clearly named job. uv's tool/python dirs are redirected into RUNNER_TEMP so the
  # runner's real environment is not polluted.
  #
  # These are the *developer* install path (OPENAGENT_SETUP_LOCAL=1). The production path is
  # covered by installer-production above; neither substitutes for the other.
  installer-unix:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      OPENAGENT_SETUP_NO_LAUNCH: "1"
      OPENAGENT_SETUP_LOCAL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Isolate uv directories
        run: |
          {
            echo "UV_TOOL_DIR=$RUNNER_TEMP/uv/tools"
            echo "UV_TOOL_BIN_DIR=$RUNNER_TEMP/uv/bin"
            echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv/py"
            echo "OPENAGENT_DATA_DIR=$RUNNER_TEMP/installer-data"
            echo "OPENAGENT_CONFIG_DIR=$RUNNER_TEMP/installer-config"
          } >> "$GITHUB_ENV"

      - name: First install (setup.sh, no TUI launch)
        run: bash setup.sh

      - name: Verify openagent, managed Python, and parseable doctor JSON
        run: |
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          openagent version
          # doctor may exit non-zero (missing optional CLIs) but must emit parseable JSON.
          openagent doctor --json > doctor.json || true
          python3 -c "import json; json.load(open('doctor.json')); print('doctor json ok')"
          # Managed Python was installed by uv — no dependency on a system Python.
          ls "$UV_PYTHON_INSTALL_DIR" | grep -i cpython

      - name: Installer created no .venv in the repo
        run: test ! -d .venv

      - name: Second install (update / idempotency)
        run: bash setup.sh

      - name: Older PATH binary is repaired, never accepted as a warning
        run: |
          mkdir -p "$RUNNER_TEMP/old-openagent"
          printf '#!/bin/sh\nprintf "openagent 0.0.1\\n"\n' > "$RUNNER_TEMP/old-openagent/openagent"
          chmod +x "$RUNNER_TEMP/old-openagent/openagent"
          PATH="$RUNNER_TEMP/old-openagent:$PATH" bash setup.sh > "$RUNNER_TEMP/old-path.log"
          grep "PATH: $UV_TOOL_BIN_DIR/openagent" "$RUNNER_TEMP/old-path.log"

      - name: Install from a path containing spaces
        run: |
          dest="$RUNNER_TEMP/Open Agent Test"
          rm -rf "$dest"; mkdir -p "$dest"
          cp -R . "$dest/"
          rm -rf "$dest/.venv"
          UV_TOOL_DIR="$RUNNER_TEMP/uv2/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv2/bin" \
            bash "$dest/setup.sh"
          "$RUNNER_TEMP/uv2/bin/openagent" version

      - name: Installer blocks future schema, broken JSON, and failed migration
        if: matrix.os == 'ubuntu-latest'
        run: |
          tool_python="$UV_TOOL_DIR/openagent/bin/python"
          fixture_project="$RUNNER_TEMP/installer-fixture-project"
          mkdir -p "$fixture_project"
          FIXTURE_PROJECT="$fixture_project" "$tool_python" - <<'PY'
          import os
          from pathlib import Path
          from sqlalchemy import text
          from openagent.app import OpenAgentApp
          from openagent.core.models import RuntimeType

          root = Path(os.environ["FIXTURE_PROJECT"])
          cases = {
              "future": Path(os.environ["RUNNER_TEMP"]) / "installer-future",
              "broken": Path(os.environ["RUNNER_TEMP"]) / "installer-broken",
              "migration": Path(os.environ["RUNNER_TEMP"]) / "installer-migration",
          }
          for name, data in cases.items():
              os.environ["OPENAGENT_DATA_DIR"] = str(data)
              os.environ["OPENAGENT_CONFIG_DIR"] = str(data / "config")
              app = OpenAgentApp.create(root / name)
              if name in {"broken", "migration"}:
                  app.agents.create(
                      name=f"{name}-agent",
                      runtime_type=RuntimeType.CLI,
                      cli="codex",
                  )
                  with app.db.engine.begin() as conn:
                      conn.execute(
                          text("UPDATE agents SET data=:data WHERE name=:name"),
                          {"data": '{"name":', "name": f"{name}-agent"},
                      )
              if name == "future":
                  with app.db.engine.begin() as conn:
                      conn.execute(
                          text("UPDATE schema_meta SET value='999' WHERE key='version'")
                      )
              if name == "migration":
                  with app.db.engine.begin() as conn:
                      conn.execute(
                          text("UPDATE schema_meta SET value='0010' WHERE key='revision'")
                      )
                      conn.execute(
                          text("UPDATE schema_meta SET value='10' WHERE key='version'")
                      )
          PY
          if OPENAGENT_DATA_DIR="$RUNNER_TEMP/installer-future" \
             OPENAGENT_CONFIG_DIR="$RUNNER_TEMP/installer-future/config" \
             bash setup.sh >"$RUNNER_TEMP/future.log" 2>&1; then
            echo "future schema unexpectedly passed"; exit 1
          fi
          grep "stage : verify-database" "$RUNNER_TEMP/future.log"
          if OPENAGENT_DATA_DIR="$RUNNER_TEMP/installer-broken" \
             OPENAGENT_CONFIG_DIR="$RUNNER_TEMP/installer-broken/config" \
             bash setup.sh >"$RUNNER_TEMP/broken.log" 2>&1; then
            echo "broken JSON unexpectedly passed"; exit 1
          fi
          grep "stage : verify-database" "$RUNNER_TEMP/broken.log"
          if OPENAGENT_DATA_DIR="$RUNNER_TEMP/installer-migration" \
             OPENAGENT_CONFIG_DIR="$RUNNER_TEMP/installer-migration/config" \
             bash setup.sh >"$RUNNER_TEMP/migration.log" 2>&1; then
            echo "failed migration unexpectedly passed"; exit 1
          fi
          grep "database backup:" "$RUNNER_TEMP/migration.log"
          grep "stage : verify-migration" "$RUNNER_TEMP/migration.log"

  # Windows production install (§3.4). Same contract as installer-production, through both Windows
  # entrypoints: setup.bat from CMD and setup.ps1 from PowerShell. Windows is where a production
  # install path is most likely to be broken and least likely to be noticed.
  installer-production-windows:
    name: production install (windows-latest, ${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [cmd, powershell]
    env:
      OPENAGENT_SETUP_NO_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Isolate uv and OpenAgent directories (path with a space)
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\oa production" 2>nul
          echo UV_TOOL_DIR=%RUNNER_TEMP%\oa production\uv\tools>> "%GITHUB_ENV%"
          echo UV_TOOL_BIN_DIR=%RUNNER_TEMP%\oa production\uv\bin>> "%GITHUB_ENV%"
          echo UV_PYTHON_INSTALL_DIR=%RUNNER_TEMP%\oa production\uv\py>> "%GITHUB_ENV%"
          echo OPENAGENT_HOME=%RUNNER_TEMP%\oa production\home>> "%GITHUB_ENV%"
          echo OA_BASE=%RUNNER_TEMP%\oa production>> "%GITHUB_ENV%"

      - name: Resolve the exact release-candidate commit and clone it
        shell: powershell
        run: |
          $sha = (& git ls-remote https://github.com/yasirkaramandev/openagent.git refs/heads/release-candidate).Split("`t")[0]
          if (-not $sha) { Write-Error "could not resolve release-candidate"; exit 1 }
          "CANDIDATE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & git clone --quiet https://github.com/yasirkaramandev/openagent.git "$env:OA_BASE\checkout"
          & git -C "$env:OA_BASE\checkout" checkout --quiet $sha
          # Test *this PR's* installers against a real channel commit — the installer at the channel
          # tip predates the change under review. HEAD is untouched, so the installer still resolves
          # and installs the channel commit.
          Copy-Item "$env:GITHUB_WORKSPACE\setup.sh","$env:GITHUB_WORKSPACE\setup.ps1","$env:GITHUB_WORKSPACE\setup.bat" -Destination "$env:OA_BASE\checkout" -Force
          Write-Host "installing exact commit $sha"

      - name: Production install through CMD (setup.bat)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          cd /d "%OA_BASE%\checkout"
          call setup.bat
          if errorlevel 1 exit /b 1

      - name: Production install through PowerShell (setup.ps1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          & "$env:OA_BASE\checkout\setup.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Provenance, channel metadata, PATH, version, and doctor
        shell: powershell
        run: |
          $env:PATH = "$env:UV_TOOL_BIN_DIR;$env:PATH"
          $du = Get-ChildItem -Path $env:UV_TOOL_DIR -Recurse -Filter direct_url.json | Select-Object -First 1
          if (-not $du) { Write-Error "no direct_url.json: not a VCS install"; exit 1 }
          $payload = Get-Content $du.FullName -Raw | ConvertFrom-Json
          if (-not $payload.url.EndsWith("yasirkaramandev/openagent.git")) { Write-Error "unexpected url $($payload.url)"; exit 1 }
          if ($payload.vcs_info.commit_id -ne $env:CANDIDATE_SHA) { Write-Error "commit $($payload.vcs_info.commit_id) != $env:CANDIDATE_SHA"; exit 1 }
          Write-Host "direct_url.json: official repository at the exact target commit"

          $metaRaw = Get-Content "$env:OPENAGENT_HOME\install.json" -Raw
          Write-Host "--- install.json ---"; Write-Host $metaRaw; Write-Host "--- end ---"
          $meta = $metaRaw | ConvertFrom-Json
          if ($meta.source -ne "official-github-vcs") { Write-Error "source $($meta.source)"; exit 1 }
          if ($meta.installed_commit -ne $env:CANDIDATE_SHA) { Write-Error "installed_commit $($meta.installed_commit)"; exit 1 }
          if ($meta.last_accepted_commit -ne $env:CANDIDATE_SHA) { Write-Error "last_accepted_commit $($meta.last_accepted_commit)"; exit 1 }
          Write-Host "install.json: channel + exact accepted commit recorded"

          $cmd = Get-Command openagent -ErrorAction Stop
          Write-Host "PATH: $($cmd.Source)"
          & openagent version
          if ($LASTEXITCODE -ne 0) { Write-Error "openagent version failed"; exit 1 }
          # doctor exits 1 on warnings (an optional CLI missing on a runner is normal), and a
          # PowerShell step fails on a non-zero $LASTEXITCODE at the end of the script. What matters
          # here is that the output parses, so the expected non-zero exit is consumed deliberately.
          & openagent doctor --json > "$env:OA_BASE\doctor.json"
          if ($LASTEXITCODE -notin @(0, 1)) { Write-Error "doctor exited $LASTEXITCODE"; exit 1 }
          $null = Get-Content "$env:OA_BASE\doctor.json" -Raw | ConvertFrom-Json
          Write-Host "doctor json ok"
          $global:LASTEXITCODE = 0

      - name: A feature-branch commit is refused as a production install source
        shell: powershell
        run: |
          $log = "$env:RUNNER_TEMP\feature.log"
          # setup.ps1's Fail writes with [Console]::Error.WriteLine, which goes to the process's
          # raw stderr handle and ignores PowerShell stream redirection — so running it in-process
          # and redirecting with `*>` captured nothing, and the assertion below read an empty log
          # while the real (correct) refusal went to the job output. Running it as a child process
          # makes its stderr an ordinary redirectable stream, and matches how a user invokes it.
          $proc = Start-Process -FilePath "powershell" `
            -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "$env:GITHUB_WORKSPACE\setup.ps1") `
            -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err" `
            -Wait -PassThru -NoNewWindow
          Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue | Set-Content $log
          Write-Host "--- installer output (exit $($proc.ExitCode)) ---"
          Get-Content $log -ErrorAction SilentlyContinue
          Write-Host "--- end ---"
          if ($proc.ExitCode -eq 0) { Write-Error "a non-channel commit was accepted as a production install"; exit 1 }
          $text = (Get-Content $log -Raw -ErrorAction SilentlyContinue)
          if ($text -notmatch "is not on the|not a published stable release") { Write-Error "wrong refusal reason"; exit 1 }
          if ($text -notmatch "OPENAGENT_SETUP_LOCAL=1") { Write-Error "refusal did not name the supported alternative"; exit 1 }
          Write-Host "feature-branch commit correctly refused"

  installer-windows:
    name: installer (windows-latest, ${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # setup.bat is documented for BOTH shells (`setup.bat` from CMD, `.\setup.bat` from
      # PowerShell), so both invocations are verified — a PowerShell-only quoting or exit-code bug
      # would otherwise ship unnoticed (spec §7.4).
      matrix:
        shell: [cmd, powershell]
    env:
      OPENAGENT_SETUP_NO_LAUNCH: "1"
      OPENAGENT_SETUP_LOCAL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Isolate uv directories
        shell: cmd
        run: |
          echo UV_TOOL_DIR=%RUNNER_TEMP%\uv\tools>> "%GITHUB_ENV%"
          echo UV_TOOL_BIN_DIR=%RUNNER_TEMP%\uv\bin>> "%GITHUB_ENV%"
          echo UV_PYTHON_INSTALL_DIR=%RUNNER_TEMP%\uv\py>> "%GITHUB_ENV%"

      - name: First install through CMD (setup.bat, no TUI launch)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: setup.bat

      - name: First install through PowerShell (.\setup.bat, no TUI launch)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          .\setup.bat
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The installer itself already proves a *fresh* CMD and PowerShell can run `openagent` from
      # the PERSISTED (registry) PATH, with no manual tool-bin injection (spec §7.3). This job
      # re-asserts it independently of the installer's own check, from this step's environment.
      - name: Fresh CMD + PowerShell find openagent via the persisted PATH
        shell: powershell
        run: |
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($user -split ';' | Where-Object { $_ -and $_.TrimEnd('\') -ieq $env:UV_TOOL_BIN_DIR.TrimEnd('\') })) {
            Write-Error "the tool dir was not persisted to the user PATH"; exit 1
          }
          # Compose the PATH a brand-new login shell would get, and use ONLY that.
          $env:Path = (@($machine, $user) | Where-Object { $_ }) -join ';'
          cmd /d /c "openagent version"
          if ($LASTEXITCODE -ne 0) { Write-Error "fresh CMD could not run openagent"; exit 1 }
          & openagent version
          if ($LASTEXITCODE -ne 0) { Write-Error "fresh PowerShell could not run openagent"; exit 1 }

      - name: Verify openagent and parseable doctor JSON
        shell: cmd
        run: |
          set "PATH=%UV_TOOL_BIN_DIR%;%PATH%"
          openagent version || exit /b 1
          openagent doctor --json > doctor.json
          python -c "import json;json.load(open('doctor.json'));print('doctor json ok')" || exit /b 1

      - name: Installer created no .venv in the repo
        shell: cmd
        run: if exist .venv exit /b 1

      - name: Second install (update / idempotency)
        shell: cmd
        run: setup.bat

      - name: Install from a path containing spaces
        shell: cmd
        run: |
          set "DEST=%RUNNER_TEMP%\Open Agent Test"
          if exist "%DEST%" rmdir /s /q "%DEST%"
          xcopy /E /I /Q /Y "%CD%" "%DEST%" >nul
          if exist "%DEST%\.venv" rmdir /s /q "%DEST%\.venv"
          set "UV_TOOL_DIR=%RUNNER_TEMP%\uv2\tools"
          set "UV_TOOL_BIN_DIR=%RUNNER_TEMP%\uv2\bin"
          call "%DEST%\setup.bat" || exit /b 1
          "%RUNNER_TEMP%\uv2\bin\openagent.exe" version || exit /b 1

  installer-powershell:
    name: installer (windows-latest, setup.ps1)
    runs-on: windows-latest
    env:
      OPENAGENT_SETUP_NO_LAUNCH: "1"
      OPENAGENT_SETUP_LOCAL: "1"
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python: setup.ps1 must bootstrap uv's managed Python itself.
      - name: Isolate uv directories
        shell: powershell
        run: |
          "UV_TOOL_DIR=$env:RUNNER_TEMP\uv-ps\tools" | Out-File $env:GITHUB_ENV -Append
          "UV_TOOL_BIN_DIR=$env:RUNNER_TEMP\uv-ps\bin" | Out-File $env:GITHUB_ENV -Append
          "UV_PYTHON_INSTALL_DIR=$env:RUNNER_TEMP\uv-ps\py" | Out-File $env:GITHUB_ENV -Append

      - name: First PowerShell install and persisted-PATH verification
        shell: powershell
        run: .\setup.ps1

      - name: Second install is an idempotent upgrade
        shell: powershell
        run: .\setup.ps1

      - name: Install from a path containing spaces
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Open Agent PowerShell Test"
          Remove-Item -LiteralPath $destination -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $PWD -Destination $destination -Recurse
          Remove-Item -LiteralPath (Join-Path $destination ".venv") -Recurse -Force -ErrorAction SilentlyContinue
          $env:UV_TOOL_DIR = "$env:RUNNER_TEMP\uv-ps2\tools"
          $env:UV_TOOL_BIN_DIR = "$env:RUNNER_TEMP\uv-ps2\bin"
          $env:UV_PYTHON_INSTALL_DIR = "$env:RUNNER_TEMP\uv-ps2\py"
          & (Join-Path $destination "setup.ps1")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:UV_TOOL_BIN_DIR\openagent.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
